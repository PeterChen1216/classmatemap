  "singapore": "鱼尾狮公园 (Merlion Park)",
  "montreal": "蒙特利尔奥林匹克体育场 (Olympic Stadium)",
  "são paulo": "保利斯塔大道 (Paulista Avenue)"
};

// 城市地标检测函数 - 用于确定城市对应的地标图标
function getCityLandmark(cityEn, cityZh) {
  // 转换为小写以便比较
  const cityEnLower = (cityEn || '').toLowerCase();
  const cityZhLower = (cityZh || '').toLowerCase();
  
  // 检查英文城市名中是否包含关键字
  for (const city in landmarkIcons) {
    // 精确匹配城市名称
    if (cityEnLower === city || 
        cityEnLower.includes(city) || 
        // 处理特殊情况
        (city === "ann arbor" && cityEnLower.includes("michigan")) ||
        (city === "são paulo" && (cityEnLower.includes("sao paulo") || cityEnLower.includes("são paulo") || cityEnLower.includes("圣保罗")))
       ) {
      return {
        icon: landmarkIcons[city],
        color: landmarkColors[city] || "#3498db", // 默认蓝色
        name: landmarkNames[city] || city
      };
    }
  }
  
  // 没有找到匹配的地标，返回默认值
  return {
    icon: "👤",
    color: "#3498db", // 默认蓝色
    name: ""
  };
}

// 创建城市位置键 - 用于对同一城市的同学进行分组
function createLocationKey(friend) {
    // 使用城市+国家作为位置键
    let cityKey = '';
    let countryKey = '';
    
    // 优先使用英文城市名和国家名（更标准化）
    if (friend.cityEn) {
        cityKey = friend.cityEn.toLowerCase();
    } else if (friend.cityZh) {
        cityKey = friend.cityZh.toLowerCase();
    }
    
    if (friend.countryEn) {
        countryKey = friend.countryEn.toLowerCase();
    } else if (friend.countryZh) {
        countryKey = friend.countryZh.toLowerCase();
    }
    
    // 返回组合键
    return `${cityKey}_${countryKey}`;
}

// 获取位置显示名称
function getLocationDisplayName(friend) {
    const { cityZh, cityEn, countryZh, countryEn, location } = friend;
    
    // 优先使用中文城市和国家名
    if (cityZh && countryZh) {
        return `${cityZh}, ${countryZh}`;
    } else if (cityEn && countryEn) {
        return `${cityEn}, ${countryEn}`;
    } else if (cityZh || cityEn) {
        return [cityZh, cityEn].filter(Boolean).join('/');
    } else {
        return location || '未知位置';
    }
}

        
        // Default icon types
        const iconTypes = {
            "default": { color: "#3498db", icon: "👤" }
        };
        
        // 添加显示所有好友的按钮监听
        document.getElementById('show-all-friends').addEventListener('click', fitMapToAllMarkers);
        document.getElementById('search-show-all').addEventListener('click', fitMapToAllMarkers);
        
        // 调整地图视图以显示所有标记
        function fitMapToAllMarkers() {
            // 如果没有标记，不进行任何操作
            if (Object.keys(markers).length === 0) {
                return;
            }
            
            // 创建一个包含所有标记的边界
            const bounds = L.latLngBounds(Object.values(markers).map(marker => marker.getLatLng()));
            
            // 调整地图视图以适应所有标记
            map.fitBounds(bounds, {
                padding: [50, 50], // 添加一些内边距
                maxZoom: 12,       // 限制最大缩放级别
                animate: true      // 使用动画
            });
        }
        
        // 添加"显示全部"按钮到地图上
        const showAllControl = L.Control.extend({
            options: {
                position: 'topleft'
            },
            
            onAdd: function(map) {
                const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                container.innerHTML = `
                    <a href="#" title="显示所有好友" style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; background-color: white; font-size: 18px;">👥</a>
                `;
                
                L.DomEvent.on(container, 'click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    L.DomEvent.preventDefault(e);
                    fitMapToAllMarkers();
                });
                
                return container;
            }
        });
        
        // 初始化tabs
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                // Remove active class from all buttons and tabs
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
                
                // Add active class to clicked button and corresponding tab
                button.classList.add('active');
                const tabId = `${button.dataset.tab}-tab`;
                document.getElementById(tabId).classList.add('active');
            });
        });
        
        // Search functionality
        document.getElementById('search-button').addEventListener('click', performSearch);
        document.getElementById('search-query').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });
        
        function performSearch() {
            const query = document.getElementById('search-query').value.trim().toLowerCase();
            const resultsContainer = document.getElementById('search-results');
            
            if (!query) {
                resultsContainer.innerHTML = '<p>请输入城市或国家来检索（支持中英文）。</p>';
                return;
            }
            
            // 获取查询的所有可能形式（中英文）
            const possibleQueries = [query];
            
            // 添加翻译版本
            if (cityCountryTranslations[query]) {
                possibleQueries.push(cityCountryTranslations[query]);
            }
            
            // 检查是否是部分匹配，如查询"new"可以匹配"new york"
            for (const key in cityCountryTranslations) {
                if (key.includes(query) && !possibleQueries.includes(key)) {
                    possibleQueries.push(key);
                    // 如果找到英文部分匹配，也添加对应的中文
                    if (cityCountryTranslations[key] && !possibleQueries.includes(cityCountryTranslations[key])) {
                        possibleQueries.push(cityCountryTranslations[key]);
                    }
                }
            }
            
            // Filter friends based on all possible queries
            const filteredFriends = friends.filter(friend => {
                // 检查所有位置相关字段
                const cityZhMatch = friend.cityZh && friend.cityZh.toLowerCase().includes(query);
                const cityEnMatch = friend.cityEn && friend.cityEn.toLowerCase().includes(query);
                const countryZhMatch = friend.countryZh && friend.countryZh.toLowerCase().includes(query);
                const countryEnMatch = friend.countryEn && friend.countryEn.toLowerCase().includes(query);
                
                // 检查旧版位置字段（兼容旧数据）
                const locationMatch = friend.location && possibleQueries.some(q => 
                    friend.location.toLowerCase().includes(q)
                );
                
                return cityZhMatch || cityEnMatch || countryZhMatch || countryEnMatch || locationMatch;
            });
            
            if (filteredFriends.length === 0) {
                resultsContainer.innerHTML = '<p>未找到在此位置的同学。</p>';
                return;
            }
            
            // 构建显示的查询词（同时展示中英文）
            let displayQuery = query;
            if (cityCountryTranslations[query]) {
                const translation = cityCountryTranslations[query];
                displayQuery = `${query} / ${translation}`;
            }
            
            // Display results
            let resultsHTML = `<h4>在"${displayQuery}"中找到 ${filteredFriends.length} 位同学</h4>`;
            
            // Group friends by location and school
            const friendsByLocation = {};
            
            filteredFriends.forEach(friend => {
                // 使用完整位置作为键
                const locationKey = createLocationKey(friend);
                if (!friendsByLocation[locationKey]) {
                    friendsByLocation[locationKey] = [];
                }
                friendsByLocation[locationKey].push(friend);
            });
            
            // Display results grouped by location
            for (const locationKey in friendsByLocation) {
                const locationFriends = friendsByLocation[locationKey];
                if (locationFriends.length === 0) continue;
                
                // Get display location from first friend
                const firstFriend = locationFriends[0];
                const locationName = getLocationDisplayName(firstFriend);
                
                resultsHTML += `<div class="search-result-location">
                    <h4>${locationName} (${locationFriends.length}人)</h4>
                    <ul>`;
                
                // Group further by school
                const schoolGroups = {};
                locationFriends.forEach(friend => {
                    const school = friend.school || '(未填写学校)';
                    if (!schoolGroups[school]) {
                        schoolGroups[school] = [];
                    }
                    schoolGroups[school].push(friend);
                });
                
                for (const school in schoolGroups) {
                    const schoolFriends = schoolGroups[school];
                    
                    resultsHTML += `<div class="search-result-school">
                        <h5>${school}</h5>
                        <ul>`;
                    
                    schoolFriends.forEach(friend => {
                        resultsHTML += `
                            <li class="search-result-item" data-location-id="${friend.locationId || ''}">
                                <strong>${friend.name}</strong>
                            </li>`;
                    });
                    
                    resultsHTML += `</ul></div>`;
                }
                
                resultsHTML += `</ul></div>`;
            }
            
            resultsContainer.innerHTML = resultsHTML;
            
            // Add click event to result items
            document.querySelectorAll('.search-result-item').forEach(item => {
                item.addEventListener('click', () => {
                    const locationId = item.dataset.locationId;
                    
                    if (locationId && markers[locationId]) {
                        // 获取相关标记位置
                        const marker = markers[locationId];
                        // 居中显示并打开弹窗
                        map.setView(marker.getLatLng(), 12);
                        marker.openPopup();
                    }
                });
            });
        }
        
        // Helper function to highlight search term in text
        function highlightText(text, query) {
            if (!text) return '';
            
            const lowerText = text.toLowerCase();
            const index = lowerText.indexOf(query.toLowerCase());
            
            if (index >= 0) {
                const before = text.substring(0, index);
                const match = text.substring(index, index + query.length);
                const after = text.substring(index + query.length);
                return `${before}<span class="highlight">${match}</span>${after}`;
            }
            
            return text;
        }
        
        // Export data
        document.getElementById('export-data').addEventListener('click', () => {
            // Convert friends array to worksheet
            const worksheet = XLSX.utils.json_to_sheet(friends.map(friend => ({
                '姓名': friend.name,
                '城市（中文）': friend.cityZh || '',
                '城市（英文）': friend.cityEn || '',
                '国家（中文）': friend.countryZh || '',
                '国家（英文）': friend.countryEn || '',
                '学校/单位': friend.school || '',
                '备注': friend.notes || ''
            })));
            
            // Create workbook and add the worksheet
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, '同学信息');
            
            // Generate Excel file
            XLSX.writeFile(workbook, '2011级华文班同学信息.xlsx');
        });
        
        // 处理预设数据并添加到地图
    async function processPresetData() {
        document.getElementById('loading-container').style.display = 'block';
        document.getElementById('friends-container').style.display = 'none';
        
        // 用于按位置分组的数据结构
        const locationGroups = {};
        
        for (const data of presetFriendData) {
            const { name, cityZh, cityEn, countryZh, countryEn, school, notes } = data;
            
            // 构建用于地理编码的位置字符串
            let geocodeLocation = '';
            
            // 优先使用英文进行地理编码，因为OpenStreetMap的API更好地支持英文
            if (cityEn && countryEn) {
                geocodeLocation = `${cityEn}, ${countryEn}`;
            } else if (cityZh && countryZh) {
                geocodeLocation = `${cityZh}, ${countryZh}`;
            } else if (cityEn) {
                geocodeLocation = cityEn;
            } else if (cityZh) {
                geocodeLocation = cityZh;
            }
            
            // 构建用于显示的位置字符串（同时显示中英文）
            let displayLocation = '';
            if (cityZh && cityEn && countryZh && countryEn) {
                displayLocation = `${cityZh}/${cityEn}, ${countryZh}/${countryEn}`;
            } else if (cityZh && countryZh) {
                displayLocation = `${cityZh}, ${countryZh}`;
            } else if (cityEn && countryEn) {
                displayLocation = `${cityEn}, ${countryEn}`;
            } else if (cityZh || cityEn) {
                displayLocation = [cityZh, cityEn].filter(Boolean).join('/');
            } else {
                displayLocation = geocodeLocation;
            }
            
            try {
                // Geocode the location
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(geocodeLocation)}`);
                const geoData = await response.json();
                
                if (geoData.length === 0) {
                    console.error(`无法获取位置: ${geocodeLocation}`);
                    continue;
                }
                
                const coordinates = [parseFloat(geoData[0].lat), parseFloat(geoData[0].lon)];
                
                // Create friend object
                const newFriend = {
                    id: `id_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`,
                    name,
                    location: displayLocation,
                    cityZh,
                    cityEn,
                    countryZh, 
                    countryEn,
                    school,
                    notes,
                    coordinates,
                    iconType: 'default'
                };
                
                // Add to friends array
                friends.push(newFriend);
                
                // 创建位置键用于分组
                const locationKey = createLocationKey(newFriend);
                
                // 添加到位置分组
                if (!locationGroups[locationKey]) {
                    locationGroups[locationKey] = {
                        friends: [],
                        coordinates: coordinates,
                        displayName: displayLocation
                    };
                }
                
                locationGroups[locationKey].friends.push(newFriend);
                
            } catch (error) {
                console.error(`处理同学信息时出错: ${name}`, error);
            }
            
            // 为了避免请求限制，在每个请求之间等待一秒
            await new Promise(resolve => setTimeout(resolve, 1000));
        }
        
        // 为每个位置组创建标记
        for (const locationKey in locationGroups) {
            addGroupMarker(locationGroups[locationKey]);
        }
        
        // 更新好友列表
        updateFriendList();
        
        // 如果有数据，自动调整地图以显示所有标记
        if (Object.keys(markers).length > 0) {
            fitMapToAllMarkers();
        }
        
        // 隐藏加载动画，显示好友列表
        document.getElementById('loading-container').style.display = 'none';
        document.getElementById('friends-container').style.display = 'block';
    }
        
        // 为位置组添加标记
        function addGroupMarker(locationGroup) {
            const friends = locationGroup.friends;
            const coordinates = locationGroup.coordinates;
            
            if (!friends || friends.length === 0) return;
            
            // 获取第一个同学信息用于地标和颜色
            const firstFriend = friends[0];
            const { cityZh, cityEn } = firstFriend;
            
            // 检查是否有城市地标
            let cityToCheck = (cityEn || '').toLowerCase();
            if (!cityToCheck) {
                cityToCheck = (cityZh || '').toLowerCase();
            }
            
            // 获取地标信息
            const landmark = getCityLandmark(cityEn, cityZh);
            
            // 根据该位置的同学数量决定图标样式
            let iconHTML, iconSize, iconAnchor;
            
            if (friends.length > 1) {
                // 多人标记 - 显示人数
                iconHTML = `
                    <div class="multi-person-icon" style="background-color: ${landmark.color}; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px;">
                        ${landmark.icon}
                        <div class="multi-person-count">${friends.length}</div>
                    </div>
                `;
                iconSize = [50, 50];
                iconAnchor = [25, 25];
            } else {
                // 单人标记
                iconHTML = `<div style="background-color: ${landmark.color}; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px;">${landmark.icon}</div>`;
                iconSize = [40, 40];
                iconAnchor = [20, 20];
            }
            
            // 创建地图标记图标
            const customIcon = L.divIcon({
                className: 'custom-icon',
                html: iconHTML,
                iconSize: iconSize,
                iconAnchor: iconAnchor
            });
    
    // 创建标记并添加到地图
    const marker = L.marker(coordinates, { icon: customIcon }).addTo(map);
    
    // 创建组弹窗内容
    let popupContent = '';
    
    if (friends.length > 1) {
        // 多人位置 - 显示所有同学信息
        const locationName = getLocationDisplayName(firstFriend);
        
        popupContent = `
            <div class="group-popup">
                <h3>${locationName} - ${friends.length}位同学</h3>
                <div class="group-popup-list">
        `;
        
        // 添加每个同学的信息
        friends.forEach(friend => {
            popupContent += `
                <div class="group-popup-item">
                    <h4>${friend.name}</h4>
                    ${friend.school ? `<p><strong>学校/单位:</strong> ${friend.school}</p>` : ''}
                    ${friend.notes ? `<p><strong>备注:</strong> ${friend.notes}</p>` : ''}
                </div>
            `;
        });
        
        popupContent += `
                </div>
                ${landmark.name ? `<p><strong>地标:</strong> ${landmark.name}</p>` : ''}
            </div>
        `;
    } else {
        // 单人位置 - 显示单个同学信息
        const friend = friends[0];
        popupContent = `
            <div class="popup-content">
                <h3>${friend.name}</h3>
                <p><strong>地点:</strong> ${friend.location}</p>
                ${friend.school ? `<p><strong>学校/单位:</strong> ${friend.school}</p>` : ''}
                ${friend.notes ? `<p><strong>备注:</strong> ${friend.notes}</p>` : ''}
                ${landmark.name ? `<p><strong>地标:</strong> ${landmark.name}</p>` : ''}
            </div>
        `;
    }
    
    // 绑定弹窗到标记
    marker.bindPopup(popupContent, { 
        maxWidth: 300,
        minWidth: 250
    });
    
    // 存储标记和对应的同学信息
    const locationId = `loc_${Date.now()}_${Math.random().toString(36).substr(2, 5)}`;
    markers[locationId] = marker;
    
    // 为每个同学保存位置引用
    friends.forEach(friend => {
        friend.locationId = locationId;
    });
}
        
        // Update friend list
        function updateFriendList() {
            const container = document.getElementById('friends-container');
            
            if (friends.length === 0) {
                container.innerHTML = '<div class="friend-item">尚未添加同学</div>';
                return;
            }
            
            container.innerHTML = '';
            friends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'friend-item';
                
                // 显示姓名和位置
                // 对于新数据格式，优先使用中文
                let displayLocation = friend.location;
                if (!displayLocation && (friend.cityZh || friend.cityEn || friend.countryZh || friend.countryEn)) {
                    const city = friend.cityZh || friend.cityEn || '';
                    const country = friend.countryZh || friend.countryEn || '';
                    displayLocation = city + (city && country ? ', ' : '') + country;
                }
                
                item.textContent = `${friend.name} - ${displayLocation}`;
                
                item.addEventListener('click', () => {
                    // 使用locationId找到对应的标记
                    if (friend.locationId && markers[friend.locationId]) {
                        map.setView(friend.coordinates, 12);
                        markers[friend.locationId].openPopup();
                    }
                });
                container.appendChild(item);
            });
        }
        
        // Function to get landmark name from location
        function getLandmarkName(locationLower) {
            if (!locationLower) return "";
            
            for (const city in landmarkIcons) {
                if (locationLower.includes(city)) {
                    switch(city) {
                        case "seattle": return "Space Needle";
                        case "paris": return "Eiffel Tower";
                        case "new york": return "Statue of Liberty";
                        case "london": return "Big Ben";
                        case "rome": return "Colosseum";
                        case "tokyo": return "Tokyo Tower";
                        case "sydney": return "Opera House";
                        case "dubai": return "Burj Khalifa";
                        case "beijing": return "Forbidden City";
                        case "shanghai": return "东方明珠广播电视塔";
                        case "hong kong": return "Victoria Peak";
                        case "cairo": return "Pyramids";
                        case "athens": return "Parthenon";
                        case "rio": return "Christ the Redeemer";
                        case "san francisco": return "Golden Gate Bridge";
                        case "venice": return "Gondola";
                        case "barcelona": return "Sagrada Familia";
                        case "las vegas": return "Casino";
                        case "moscow": return "Kremlin";
                        case "taipei": return "Taipei 101";
                        default: return "";
                    }
                }
            }
            return "";
        }
        
        // 添加"显示全部"按钮到地图
        map.addControl(new showAllControl());
        
        // 页面加载时处理预设数据
        window.addEventListener('load', processPresetData);

        // 添加控制台错误监听，方便调试
        window.addEventListener('error', function(e) {
            console.error('JavaScript错误:', e.message, 'at', e.filename, 'line', e.lineno);
        });
    </script>
